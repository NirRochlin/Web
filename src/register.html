<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="content bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white w-full max-w-sm p-8 rounded shadow">
    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Register</h1>

    <form id="registerForm" action="/src/register" method="post" class="space-y-4">
      <div>
        <input
          type="text"
          id="userInput"
          name="username"
          placeholder="Username"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <div>
        <input
          type="email"
          id="mailInput"
          name="email"
          placeholder="Email"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <div>
        <input
          type="password"
          id="passInput"
          name="password"
          placeholder="Password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <div>
        <input
          type="password"
          id="confirmInput"
          name="confirmPassword"
          placeholder="Confirm Password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <div>
        <label for="dateInput" class="block text-sm font-medium text-gray-700 mb-2">
          Date of Birth
        </label>
        <input
          type="date"
          id="dateInput"
          name="dob"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <div id="arithmetic-captcha-container" class="space-y-2">
        <label for="arithmeticAnswer" class="block text-sm font-medium text-gray-700">
          Solve the CAPTCHA:
        </label>

        <div class="flex items-center space-x-4">
          <span id="arithmeticChallenge" class="text-lg font-semibold text-gray-800"></span>

          <button type="button" id="refreshArithmeticCaptcha" title="Refresh CAPTCHA">
            <img
              class="h-10"
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/ReCAPTCHA_icon.svg/150px-ReCAPTCHA_icon.svg.png?20231023175148"
              alt="Refresh CAPTCHA"
            />
          </button>
        </div>

        <input
          type="text"
          id="arithmeticAnswer"
          name="arithmetic-answer"
          class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
          placeholder="Enter the answer"
          required
        />

        <p id="arithmeticError" class="mt-1 text-sm text-red-500 hidden">
          Incorrect CAPTCHA answer.
        </p>

        <p id="captchaAttemptsError" class="mt-1 text-sm text-red-500 hidden">
          You have reached the maximum number of incorrect CAPTCHA attempts.
        </p>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-500 text-white py-3 rounded hover:bg-blue-600 transition"
      >
        Register
      </button>
    </form>

    <div id="registerMessage" class="mt-3 text-sm text-center text-red-500"></div>

    <p class="text-center mt-6 text-sm">
      <a href="login.html" class="text-blue-500 hover:underline">
        Already have an account? Login
      </a>
    </p>
  </div>

  <script src="users.js"></script>
  <script src="captcha.js"></script>
</body>
</html>
